<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
<!-- =====================================================================
       CHẶN NHÁY NỘI DUNG THÔ KHI CHƯA CÓ ĐỊNH DẠNG

       ⚠️ KHỐI NÀY PHẢI NẰM TRONG PHẦN ĐẦU TRANG. Trước đây nó đặt ở khoảng
       giữa phần đầu và phần thân — vị trí không hợp lệ, trình duyệt tự dời đi
       nên áp dụng trễ.

       ⚠️ KHÔNG viết tên thẻ HTML kèm dấu ngoặc trong chú thích này. Công cụ
       dựng quét chuỗi để tìm chỗ chèn thẻ script; gặp một thẻ đóng viết trong
       chú thích là nó chèn NGAY VÀO ĐÓ — script nằm lọt trong chú thích, không
       bao giờ chạy, cả trang trắng trơn mà không báo lỗi gì.
       Hậu quả thấy được: mở web trên điện thoại, nội dung khung trợ lý
       ("Xin chào! Tôi là trợ lý ảo của Công an thị xã Tân Châu…") hiện ra
       CHỮ TO, tràn màn hình, đè lên trang chủ vài giây rồi mới biến mất.

       Nguyên nhân gốc: tệp CSS tải sau HTML. Trong khoảng chờ đó, trình duyệt
       vẽ nội dung bằng định dạng mặc định — chữ to, không màu, không sắp xếp.

       Cách chặn: ẩn #root cho tới khi ứng dụng vẽ xong.

       Có LỐI THOÁT: nếu vì lý do nào đó CSS hoặc JavaScript không tải được,
       hàm đếm giờ 3 giây vẫn hiện trang ra. Thà xấu một chút còn hơn để bà con
       nhìn trang trắng vĩnh viễn.
       ===================================================================== -->
  <style id="chan-nhap-nhay">
    /* Phủ nền sẵn màu trang để lúc chờ không loé trắng */
    html { background: #f8fafc; }
    html.dark { background: #020617; }
    /* Ẩn CẢ THÂN TRANG, không chỉ #root.
       Ẩn mỗi #root là chưa đủ chắc: bất kỳ thứ gì được vẽ ngoài #root (hộp
       thoại, lớp nổi, thư viện tự chèn thẻ vào cuối trang) vẫn hiện ra thô. */
    body { visibility: hidden; }
    html.san-sang body { visibility: visible; }
    #root { visibility: hidden; }
    /* Ứng dụng vẽ xong -> main.tsx gắn lớp này -> hiện ra, có chuyển mượt */
    html.san-sang #root { visibility: visible; animation: hien-muot .25s ease-out; }
    @keyframes hien-muot { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <script>
    /* Lối thoát: 3 giây không thấy ứng dụng báo sẵn sàng thì cứ hiện */
    setTimeout(function () {
      document.documentElement.classList.add('san-sang');
    }, 3000);
  </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B5E20" />
    <!-- SEO -->
    <meta
      name="description"
      content="Hộp Thư An Ninh Số — Nền tảng tiếp nhận, phân loại và xử lý ý kiến công dân của Công an xã/phường."
    />
    <meta name="keywords" content="hộp thư an ninh số, công an xã, phản ánh, tố giác, tra cứu, tin báo" />
    <meta property="og:title" content="Hộp Thư An Ninh Số" />
    <meta property="og:description" content="Tiếp nhận ý kiến công dân trực tuyến — gửi trong 1 phút" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <!--
      Font BE VIETNAM PRO — do người Việt thiết kế riêng cho tiếng Việt.

      VÌ SAO ĐỔI TỪ INTER SANG:
      Inter là font phương Tây, dấu tiếng Việt 2 tầng (Ố = Ô + sắc, Ộ, Ế, Ữ...)
      bị vẽ đè hoặc cắt cụt -> "HỘP THƯ AN NINH SỐ" hiện thành "...SÔ".
      Be Vietnam Pro dựng riêng từng glyph cho dấu 2 tầng nên luôn hiển thị đủ.

      Google tự gửi kèm bộ ký tự tiếng Việt qua unicode-range (không cần &subset=,
      tham số này KHÔNG hợp lệ với API css2 và có thể làm hỏng cả file font).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Áp dụng dark mode sớm để tránh nháy màn hình khi tải trang.
      Để ở file riêng chứ KHÔNG viết inline: CSP chặn script inline (xem
      public/theme-init.js). Không đặt defer/async — phải chạy xong trước khi vẽ.
    -->
    <script src="/theme-init.js"></script>
    <!-- Structured data cho SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentOrganization",
        "name": "Hộp Thư An Ninh Số",
        "description": "Nền tảng tiếp nhận, phân loại và xử lý ý kiến công dân",
        "areaServed": "VN"
      }
    </script>
    <title>Hộp Thư An Ninh Số | Tiếp nhận ý kiến công dân trực tuyến — gửi trong 1 phút</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
