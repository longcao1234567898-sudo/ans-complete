<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ô GIỮ CHỖ CHO MÃ QR NHÓM ZALO

  Đây KHÔNG phải mã QR. Đây là tấm ảnh tạm để chân trang không hiện ảnh sai
  trong lúc đơn vị chưa cấp mã thật.

  CÁCH THAY:
    1. Mở nhóm Zalo -> Tuỳ chọn -> Mã QR nhóm -> lưu ảnh về máy.
    2. Đặt ảnh vào thư mục public/media/ (ví dụ: zalo-qr.png).
    3. Sửa UNIT.zaloQrImage trong src/utils/constants.ts thành '/media/zalo-qr.png'.

  Nên để ảnh trong public/media/ thay vì dẫn link từ trang chia sẻ ảnh miễn
  phí: link ngoài có thể đổi nội dung hoặc bị xoá bất cứ lúc nào mà không ai
  hay biết.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Chua cap nhat ma QR nhom Zalo">
  <rect width="200" height="200" rx="16" fill="#F1F5F9"/>
  <rect x="8" y="8" width="184" height="184" rx="12" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Ba ô vuông định vị, gợi hình mã QR nhưng cố ý KHÔNG quét được -->
  <g fill="#CBD5E1">
    <rect x="32" y="32" width="34" height="34" rx="6"/>
    <rect x="134" y="32" width="34" height="34" rx="6"/>
    <rect x="32" y="134" width="34" height="34" rx="6"/>
  </g>
  <g fill="#F1F5F9">
    <rect x="42" y="42" width="14" height="14" rx="3"/>
    <rect x="144" y="42" width="14" height="14" rx="3"/>
    <rect x="42" y="144" width="14" height="14" rx="3"/>
  </g>

  <text x="100" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">Chua cap nhat</text>
  <text x="100" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">ma QR nhom Zalo</text>
</svg>
