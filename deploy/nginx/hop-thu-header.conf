# ============================================================================
#  HEADER BẢO MẬT CỦA GIAO DIỆN TRÊN NGINX (máy Viettel) — Hộp Thư An Ninh Số
# ============================================================================
#
#  Bản tương đương public/_headers (Netlify) và vercel.json (Vercel). Ba nơi
#  phải GIỐNG NHAU — test server/tests/trien-khai-nginx.test.js so từng ký tự.
#  Sửa một header ở đây thì sửa cả hai nơi kia (và ngược lại).
#
#  ⚠️ KHÔNG chép tệp này thẳng vào /etc/nginx. Kịch bản deploy/dung-giao-dien.sh
#     thay chỗ __MAY_CHU__ bằng địa chỉ máy chủ (VITE_API_URL, VITE_ADMIN_API_URL)
#     rồi mới đặt vào /etc/nginx/snippets/hop-thu-header.conf. Cùng biến đó được
#     nhúng vào gói JS lúc dựng, nên CSP và gói JS không bao giờ lệch nhau — trên
#     Netlify phải sửa tay ba nơi (A6-2), lệch một ký tự là chặn sạch mọi lời gọi.
#
#  "always": Nginx mặc định BỎ add_header ở trang lỗi (404, 500…). Trang lỗi cũng
#  phải có CSP và chống nhúng iframe như mọi trang khác.
#
#  ⚠️ BẪY THỪA KẾ CỦA NGINX: location nào có add_header riêng (vd Cache-Control)
#     thì KHÔNG nhận add_header của cấp server. Vì vậy hop-thu-giao-dien.conf
#     include tệp này ở TỪNG location có add_header — test kiểm việc đó.
# ============================================================================

# Ép trình duyệt LUÔN dùng HTTPS trong 2 năm (chống nghe lén, hạ cấp HTTP)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Chống nhúng trang vào iframe web khác (chống clickjacking)
add_header X-Frame-Options "DENY" always;

# Chống trình duyệt "đoán" sai kiểu tệp
add_header X-Content-Type-Options "nosniff" always;

# Không rò rỉ địa chỉ trang khi người dân bấm sang web khác
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Khoá quyền nhạy cảm — chỉ mở micro (nhập giọng nói) và vị trí cho chính trang này
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(), usb=(), interest-cohort=()" always;

# CSP — giải thích từng mục ở public/_headers. __MAY_CHU__ = địa chỉ máy chủ API
# (kịch bản dựng tự thay, kiểm dạng https://ten-mien trước khi thay).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; script-src-elem 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' __MAY_CHU__; connect-src 'self' __MAY_CHU__ https://api.cloudinary.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
