# ============================================================================
#  GIAO DIỆN NGƯỜI DÂN + CÁN BỘ TRÊN NGINX (máy Viettel) — thay Netlify/Vercel
# ============================================================================
#
#  Cài MỘT LẦN (hướng dẫn: docs/HUONG-DAN-TRIEN-KHAI.md, Phần F):
#    1. Thay mọi chữ "ten-mien.vn" bằng tên miền thật.
#    2. Chép vào /etc/nginx/sites-available/hop-thu-giao-dien, nối sang sites-enabled.
#    3. certbot --nginx -d ten-mien.vn -d www.ten-mien.vn  (certbot tự thêm HTTPS vào tệp).
#  Sau đó KHÔNG chép đè tệp này nữa (sẽ mất phần HTTPS certbot đã thêm). Mỗi lần
#  có bản mới chỉ chạy deploy/dung-giao-dien.sh — kịch bản chỉ thay thư mục bản
#  dựng và tệp header, không đụng tệp này.
#
#  Thư mục phục vụ là /var/www/hop-thu/hien-tai — một liên kết trỏ tới bản dựng
#  đang dùng (ban-NGAYGIO). Quay về bản cũ = trỏ liên kết sang bản cũ (Phần F).
# ============================================================================

# Tên miền trần -> www (một địa chỉ duy nhất: CORS_ORIGIN ở máy chủ chỉ cần ghi một)
server {
    listen 80;
    server_name ten-mien.vn;
    server_tokens off;
    return 301 https://www.ten-mien.vn$request_uri;
}

server {
    listen 80;
    server_name www.ten-mien.vn;
    server_tokens off;
    charset utf-8;

    root /var/www/hop-thu/hien-tai;
    index index.html;

    # Header bảo mật cho mọi phản hồi (bản đã thay địa chỉ máy chủ do kịch bản dựng đặt vào)
    include snippets/hop-thu-header.conf;

    # Nén tệp chữ — Nginx mặc định chỉ nén HTML
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Ứng dụng một trang: React Router tự đọc đường dẫn. Gõ thẳng /tra-cuu hay F5
    # giữa chừng thì không có tệp /tra-cuu -> trả index.html (như _redirects của Netlify).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ Từ đây trở xuống, location nào có add_header riêng PHẢI include lại header
    #    bảo mật — Nginx không thừa kế add_header của server vào location đó.

    # Ba tệp phải hỏi lại máy chủ mỗi lần (gốc rễ lỗi "kẹt ở bản cũ" — xem public/_headers)
    location = /index.html {
        include snippets/hop-thu-header.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        include snippets/hop-thu-header.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.json {
        include snippets/hop-thu-header.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Tên tệp chứa mã băm (index-AbC123.js): đổi nội dung là đổi tên -> lưu đệm vĩnh viễn.
    # Thiếu tệp thì 404 thật — trả index.html thay cho tệp JS là lỗi MIME rất khó đoán.
    # Cache-Control ở đây CỐ Ý không có "always": có thì trang 404 cũng mang "lưu 1 năm"
    # và trình duyệt nhớ "không có tệp" suốt một năm (bắt được khi chạy thử ở P67).
    location /assets/ {
        include snippets/hop-thu-header.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tệp cấu hình riêng của Netlify nằm lẫn trong dist/ — trên Nginx không cần phục vụ
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }
}
